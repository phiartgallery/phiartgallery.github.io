name = "phi-contact"
main = "index.js"
compatibility_date = "2024-11-01"

# Publish to the public <name>.<subdomain>.workers.dev URL, but skip the extra
# per-version preview URLs (fewer public endpoints).
workers_dev = true
preview_urls = false

# Non-secret config. RESEND_API_KEY is set separately as a secret:
#   npx wrangler secret put RESEND_API_KEY
[vars]
TO_EMAIL = "contact@phigallery.art"
FROM_EMAIL = "Phi Gallery <contact@phigallery.art>"
ALLOWED_ORIGIN = "https://phigallery.art"
